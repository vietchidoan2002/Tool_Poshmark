# Review Render's displayed monthly charges before creating these resources.
# This blueprint uses the preview branch; it never merges into master.
services:
  - type: web
    name: poshmark-label-web
    runtime: node
    branch: preview/ui-single-pass-ocr
    plan: starter
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm run start:web
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: web
      - key: DATABASE_URL
        fromDatabase:
          name: poshmark-label-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: poshmark-label-db
    plan: basic-256mb
    databaseName: poshmark
    user: poshmark
